<div class="nav-tree__links">
  <a [routerLink]="['/home/objects']" [routerLinkActive]="'active'">
    <mat-icon class="icon-button--inactive">account_tree</mat-icon>
    <span>Objects</span>
  </a>
  <a [routerLink]="['/home/spaces']" class="" [routerLinkActive]="'active'">
    <mat-icon>holiday_village</mat-icon>
    <span>Spaces</span>
  </a>
</div>
<div>
  <div class="nav-tree__operations">
    @let selected = selected$ | async;
    <button matIconButton [disabled]="selected?.length == 0 || operationLoading()" (click)="onAddClick()">
      <mat-icon>add</mat-icon>
    </button>
    <mat-divider vertical="true"></mat-divider>

    @if(!loadingCopyData()) {
    <button matIconButton class="multiline-tooltip" [disabled]="selected?.length == 0 || operationLoading()"
      [matTooltip]="toolBarMessages().copy" animate.enter="animation--enter" animate.leave="animation--leave"
      (click)="onCopyClick()">
      <mat-icon>content_copy</mat-icon>
    </button>
    } @else {
    <mat-spinner mode="indeterminate" animate.enter="animation--enter" animate.leave="animation--leave" [diameter]="36"
      [strokeWidth]="6"></mat-spinner>
    }

    @if(!objectOpsService.fetchingPasteData()) {
    <button matIconButton class="multiline-tooltip" [disabled]="objectOpsService.clipboard().length === 0 || operationLoading()"
      [matTooltip]="toolBarMessages().paste" animate.enter="animation--enter" animate.leave="animation--leave"
      (click)="onPasteClick()">

      @if(objectOpsService.clipboard().length > 0 && !pasteAllowed()) {
      <mat-icon>content_paste_off</mat-icon>
      } @else {
      <mat-icon>content_paste</mat-icon>
      }

    </button>
    } @else {
    <mat-spinner mode="indeterminate" animate.enter="animation--enter" animate.leave="animation--leave" [diameter]="36"
      [strokeWidth]="6"></mat-spinner>
    }

    <mat-divider vertical="true"></mat-divider>
    <span class="flex-spacer"></span>
    <div class="button-align--right">
      @if(!loadingDeleteData()) {
      <!-- <button matIconButton class="button-align--right" animate.enter="animation--enter" -->
      <button matIconButton class="object-tree__button" animate.enter="animation--enter"
        animate.leave="animation--leave" [disabled]="selected?.length == 0 || operationLoading()"
        [matTooltip]="toolBarMessages().delete" (click)="onDeleteClick()">
        <mat-icon>delete</mat-icon>
      </button>
      } @else {
      <mat-spinner mode="indeterminate" animate.enter="animation--enter" animate.leave="animation--leave"
        [diameter]="36" [strokeWidth]="6"></mat-spinner>
      }

    </div>
  </div>

  @if(pasteInProgress()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <!-- @let copyProgress = objectOpsService.copyProgress(); -->

<div style="visibility:hidden;position:fixed" [style.left]="contextMenuPosition.x" [style.top]="contextMenuPosition.y"
  [matMenuTriggerFor]="nodeContextMenu">
</div>

<mat-menu #nodeContextMenu="matMenu">
  <button mat-menu-item [disabled]="selected?.length == 0 || operationLoading()" (click)="onViewClick()">
    <mat-icon>preview</mat-icon> View
  </button>
  <button mat-menu-item [disabled]="selected?.length == 0 || operationLoading()" (click)="onCopyClick()">
    <mat-icon>content_copy</mat-icon> Copy
  </button>
  <button mat-menu-item [disabled]="objectOpsService.clipboard().length === 0 || operationLoading()" (click)="onPasteClick()">
    @if(objectOpsService.clipboard().length > 0 && !pasteAllowed()) {
    <mat-icon>content_paste_off</mat-icon>
    } @else {
    <mat-icon>content_paste</mat-icon>
    }
    Paste
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item [disabled]="selected?.length == 0 || operationLoading()" (click)="onDeleteClick()">
    <mat-icon>delete</mat-icon> Delete
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="onRefreshNodeClick()">
    <mat-icon>refresh</mat-icon> Refresh Node
  </button>
</mat-menu>

<router-outlet />
